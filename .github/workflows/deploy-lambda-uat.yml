name: Deploy Node.js Lambda (UAT)

# UAT pipeline. Mirrors deploy-lambda.yml (production) with three differences:
#   - triggers on the `uat` branch instead of `main`
#   - deploys to the UAT function, which lives in ap-south-1 next to the UAT
#     database (private subnet in respyr-dr-test-vpc)
#   - never touches the production function
#
# Requirements outside this file:
#   - IAM role github-lambda-deploy-role must allow lambda:UpdateFunctionCode
#     on arn:aws:lambda:ap-south-1:852567286882:function:respyr-metabolism-web-uat
#   - its OIDC trust policy must accept ref refs/heads/uat (prod may be
#     restricted to refs/heads/main)

on:
  push:
    branches:
      - uat

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  FUNCTION_NAME: respyr-metabolism-web-uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create Lambda zip
        run: |
          rm -f lambda.zip
          zip -r lambda.zip . \
          -x ".git/*" ".github/*" "node_modules/.cache/*" "*.log" "lambda.zip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: arn:aws:iam::852567286882:role/github-lambda-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to Lambda (UAT)
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --zip-file fileb://lambda.zip

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"
